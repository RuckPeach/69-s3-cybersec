services:
  db:
    image: postgres:16-alpine
    container_name: 69-s3-db
    ports:
      - "54327:5432"
    environment:
      - POSTGRES_PASSWORD=***REDACTED***
      - POSTGRES_USER=danupong
      - POSTGRES_DB=danupong
    volumes:
      - ***REDACTED***/postgres:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:9.16
    container_name: 69-s3-admin
    ports:
      - "8083:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ***REDACTED***
      PGADMIN_DEFAULT_PASSWORD: ***REDACTED***
    volumes:
      - ***REDACTED***/pgadmin:/var/lib/pgadmin
